experiment_id: mask2former_swin_small_clinical_hier_presence_v1
model_type: mask2former_improved
backbone: swin_small
pretrained_checkpoint: facebook/mask2former-swin-small-coco-panoptic
num_labels: 31
height: 512
width: 896
n_folds: 5
epochs: 100
seed: 2026
batch_size: 1
gradient_accumulation: 4
num_workers: 4
learning_rate: 0.0001
weight_decay: 0.0001

# Checkpointing/early stopping use the Task-1/Task-2 validation surrogate.
early_stopping_patience: 15
early_stopping_min_delta: 0.0001

# L = L_fine_clinical + 0.6 L_coarse + 0.2 L_hier + 0.2 L_presence
coarse_loss_weight: 0.6
hierarchy_loss_weight: 0.2
presence_loss_weight: 0.2
presence_pos_weight_max: 8.0

# Soft inference modulation and direct/derived coarse fusion.
presence_epsilon: 0.25
presence_gamma: 1.0
coarse_fusion_beta: 0.5

# Explicit stage switches retained in artifacts for reproducible ablations.
clinical_weighting: true
direct_coarse_head: true
hierarchical_consistency: true
presence_head: true
confusion_prototype: false
class_aware_boundary: false
